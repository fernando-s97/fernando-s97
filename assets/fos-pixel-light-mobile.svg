<svg xmlns="http://www.w3.org/2000/svg" width="480" height="520" viewBox="0 0 480 520" role="img" aria-labelledby="title desc">
  <title id="title">FOS — This could be easier.</title>
  <desc id="desc">A tangled line leads into a sketch, then a useful app. A small yellow piece settles into place once; reduced-motion preferences keep it still.</desc>
  <defs><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#C5D5C5"/></pattern></defs>
  <rect width="480" height="520" rx="20" fill="#F3F7EE"/>
<style>
    .last-piece { animation: settle 1.6s ease-out 1; transform-box: fill-box; transform-origin: center; }
    @keyframes settle { from { opacity: 0; translate: -12px -8px; rotate: -20deg; } to { opacity: 1; translate: 0 0; rotate: 0deg; } }
    @media (prefers-reduced-motion: reduce) { .last-piece { animation: none; } }
